<div class="container">
  <mat-toolbar>
    <button matButton class="nav-button" routerLink="/" aria-label="Inicio">
      <svg lucideHouse size="20" aria-hidden="true"></svg>
      <span>Inicio</span>
    </button>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuTratamientos">
      <svg lucidePill size="20" aria-hidden="true"></svg>
      <span>Tratamientos</span>
    </button>
    <mat-menu #menuTratamientos="matMenu">
      <button mat-menu-item routerLink="/tratamientos/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/tratamientos/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuDiagnosticos">
      <svg lucideHeartPulse size="20" aria-hidden="true"></svg>
      <span>Diagnósticos</span>
    </button>
    <mat-menu #menuDiagnosticos="matMenu">
      <button mat-menu-item routerLink="/diagnosticos/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/diagnosticos/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuExamenes">
      <svg lucideFileText size="20" aria-hidden="true"></svg>
      <span>Exámenes</span>
    </button>
    <mat-menu #menuExamenes="matMenu">
      <button mat-menu-item routerLink="/examenes/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/examenes/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuRecetas">
      <svg lucideFileText size="20" aria-hidden="true"></svg>
      <span>Recetas</span>
    </button>
    <mat-menu #menuRecetas="matMenu">
      <button mat-menu-item routerLink="/recetas/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/recetas/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuCitas">
      <svg lucideCalendarDays size="20" aria-hidden="true"></svg>
      <span>Citas</span>
    </button>
    <mat-menu #menuCitas="matMenu">
      <button mat-menu-item routerLink="/citas/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/citas/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuHistorias">
      <svg lucideClipboardList size="20" aria-hidden="true"></svg>
      <span>Historias clínicas</span>
    </button>
    <mat-menu #menuHistorias="matMenu">
      <button mat-menu-item routerLink="/historiasclinicas/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/historiasclinicas/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>
  </mat-toolbar>
</div>
