<div class="container">
  <mat-toolbar>
    <button matButton class="nav-button" routerLink="/" aria-label="Inicio">
      <svg lucideHouse size="20" aria-hidden="true"></svg>
      <span>Inicio</span>
    </button>

    @if (esPersonal) {
    <button matButton class="nav-button" [matMenuTriggerFor]="menuTratamientos">
      <svg lucidePill size="20" aria-hidden="true"></svg>
      <span>Tratamientos</span>
    </button>
    <mat-menu #menuTratamientos="matMenu">
      <button mat-menu-item routerLink="/tratamientos/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/tratamientos/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuDiagnosticos">
      <svg lucideHeartPulse size="20" aria-hidden="true"></svg>
      <span>Diagnósticos</span>
    </button>
    <mat-menu #menuDiagnosticos="matMenu">
      <button mat-menu-item routerLink="/diagnosticos/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/diagnosticos/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuExamenes">
      <svg lucideFileText size="20" aria-hidden="true"></svg>
      <span>Exámenes</span>
    </button>
    <mat-menu #menuExamenes="matMenu">
      <button mat-menu-item routerLink="/examenes/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/examenes/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuRecetas">
      <svg lucideFileText size="20" aria-hidden="true"></svg>
      <span>Recetas</span>
    </button>
    <mat-menu #menuRecetas="matMenu">
      <button mat-menu-item routerLink="/recetas/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/recetas/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>
    }

    <button matButton class="nav-button" [matMenuTriggerFor]="menuCitas">
      <svg lucideCalendarDays size="20" aria-hidden="true"></svg>
      <span>Citas</span>
    </button>
    <mat-menu #menuCitas="matMenu">
      @if (esPersonal) {
      <button mat-menu-item routerLink="/citas/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/citas/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
      }
      <button mat-menu-item routerLink="/citas/estado"><svg lucideSearch aria-hidden="true"></svg>{{ esPersonal ? 'Consultar estado' : 'Mis citas' }}</button>
    </mat-menu>

    @if (esPersonal) {
    <button matButton class="nav-button" [matMenuTriggerFor]="menuHistorias">
      <svg lucideClipboardList size="20" aria-hidden="true"></svg>
      <span>Historias clínicas</span>
    </button>
    <mat-menu #menuHistorias="matMenu">
      <button mat-menu-item routerLink="/historiasclinicas/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/historiasclinicas/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>
    }
    @if (esPaciente) {
    <button matButton class="nav-button" routerLink="/historiasclinicas/mi-historial">
      <svg lucideFileHeart size="20" aria-hidden="true"></svg>
      <span>Mi historia clínica</span>
    </button>
    }
    <button matButton class="nav-button" [matMenuTriggerFor]="menuEspecialidades">
      <svg lucideStethoscope size="20" aria-hidden="true"></svg>
      <span>Especialidades</span>
    </button>
    <mat-menu #menuEspecialidades="matMenu">
      @if (esPersonal) {
      <button mat-menu-item routerLink="/especialidades/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      }
      @if (esAdmin) {
      <button mat-menu-item routerLink="/especialidades/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
      }
      <button mat-menu-item routerLink="/especialidades/medicos"><svg lucideUsers aria-hidden="true"></svg>Médicos por especialidad</button>
    </mat-menu>

    @if (esAdmin) {
    <button matButton class="nav-button" [matMenuTriggerFor]="menuRoles">
      <svg lucideShieldCheck size="20" aria-hidden="true"></svg>
      <span>Roles</span>
    </button>
    <mat-menu #menuRoles="matMenu">
      <button mat-menu-item routerLink="/roles/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/roles/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>
    }

    @if (esPersonal) {
    <button matButton class="nav-button" [matMenuTriggerFor]="menuUsuarios">
      <svg lucideUsers size="20" aria-hidden="true"></svg>
      <!-- El médico solo ve pacientes, así que el menú se llama como lo que encuentra -->
      <span>{{ esAdmin ? 'Usuarios' : 'Mis pacientes' }}</span>
    </button>
    <mat-menu #menuUsuarios="matMenu">
      <button mat-menu-item routerLink="/usuarios/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      @if (esAdmin) {
      <button mat-menu-item routerLink="/usuarios/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
      }
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuReportes">
      <svg lucideChartColumn size="20" aria-hidden="true"></svg>
      <span>Reportes</span>
    </button>
    <mat-menu #menuReportes="matMenu">
      <button mat-menu-item routerLink="/reportes/examenes-pendientes"><svg lucideClock3 aria-hidden="true"></svg>Exámenes pendientes</button>
      <button mat-menu-item routerLink="/reportes/examenes-por-paciente"><svg lucideChartColumn aria-hidden="true"></svg>Exámenes por paciente</button>
      <button mat-menu-item routerLink="/reportes/tiempo-entrega-examenes"><svg lucideHourglass aria-hidden="true"></svg>Tiempo de entrega de exámenes</button>
      <button mat-menu-item routerLink="/reportes/citas-por-especialidad"><svg lucideChartColumnStacked aria-hidden="true"></svg>Citas por especialidad</button>
      <button mat-menu-item routerLink="/reportes/evolucion-mensual-citas"><svg lucideChartLine aria-hidden="true"></svg>Evolución mensual de citas</button>
      <button mat-menu-item routerLink="/reportes/diagnosticos-por-historia"><svg lucideChartBarDecreasing aria-hidden="true"></svg>Diagnósticos por historia</button>
      <button mat-menu-item routerLink="/reportes/notificaciones-por-estado"><svg lucideBell aria-hidden="true"></svg>Notificaciones por estado</button>
      <button mat-menu-item routerLink="/reportes/diagnosticos-frecuentes"><svg lucideHeartPulse aria-hidden="true"></svg>Diagnósticos frecuentes</button>
      @if (esAdmin) {
      <button mat-menu-item routerLink="/reportes/espera-por-medico"><svg lucideTimer aria-hidden="true"></svg>Espera por médico</button>
      <button mat-menu-item routerLink="/reportes/medicos-por-especialidad"><svg lucideChartPie aria-hidden="true"></svg>Médicos por especialidad</button>
      }
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuDetalleHistorial">
      <svg lucideNotebookPen size="20" aria-hidden="true"></svg>
      <span>Detalle historial</span>
    </button>
    <mat-menu #menuDetalleHistorial="matMenu">
      <button mat-menu-item routerLink="/detallehistorial/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/detallehistorial/insertar"><svg lucideFilePlus aria-hidden="true"></svg>Insertar</button>
    </mat-menu>

    <button matButton class="nav-button" [matMenuTriggerFor]="menuNotificaciones">
      <svg lucideBell size="20" aria-hidden="true"></svg>
      <span>Notificaciones</span>
    </button>
    <mat-menu #menuNotificaciones="matMenu">
      <button mat-menu-item routerLink="/notificaciones/listar"><svg lucideList aria-hidden="true"></svg>Listar</button>
      <button mat-menu-item routerLink="/notificaciones/enviar"><svg lucideSend aria-hidden="true"></svg>Notificar cita</button>
    </mat-menu>
    }

    @if (username) {
      <span class="user-info">
        <svg lucideCircleUserRound size="20" aria-hidden="true"></svg>
        {{ username }} <span class="role">Roles: {{ roles }}</span>
      </span>

      <button matButton class="nav-button logout-button" type="button" (click)="cerrarSesion()">
        <svg lucideLogOut size="20" aria-hidden="true"></svg>
        <span>Cerrar sesión</span>
      </button>
    }
  </mat-toolbar>
</div>
