<div class="container">
    <div>
        <h2>{{ isEditing ? 'Actualizar historia clínica' : 'Registrar historia clínica' }}</h2>
    </div>
    <div>
        <form [formGroup]="formHistorias" (ngSubmit)="insertarHistoria()">
            @if (isEditing) {
            <mat-form-field>
                <mat-label>ID de la historia clínica</mat-label>
                <input matInput type="number" formControlName="idHistoriaClinica" readonly>
            </mat-form-field>
            <br>
            }
            <mat-form-field>
                <mat-label>Paciente</mat-label>
                <mat-select formControlName="paciente">
                    @for (p of listaPacientes(); track p.idUsuario) {
                    <mat-option [value]="p.idUsuario">{{p.nombres}} {{p.apellidos}} - DNI {{p.dni}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Fecha de creación</mat-label>
                <input matInput [matDatepicker]="pickerCreacion" formControlName="fechaCreacion">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="pickerCreacion">
                    <svg matDatepickerToggleIcon lucideCalendarDays aria-hidden="true"></svg>
                </mat-datepicker-toggle>
                <mat-datepicker #pickerCreacion></mat-datepicker>
            </mat-form-field>
            <br>
            <button matButton type="submit" class="btn-primary">
                <svg lucideSave aria-hidden="true"></svg>
                {{ isEditing ? 'Actualizar' : 'Guardar' }}
            </button>
            @if (isEditing) {
            <button matButton type="button" class="btn-outline" routerLink="/historiasclinicas/listar">
                <svg lucideCircleX aria-hidden="true"></svg>
                Cancelar
            </button>
            }
        </form>
        <p>{{ mensaje }}</p>
    </div>
</div>
