<h2>{{ isEditing ? 'Actualizar examen' : 'Registrar examen' }}</h2>
<form [formGroup]="formExamenes" (ngSubmit)="insertarExamen()">
  @if (isEditing) {
    <mat-form-field>
      <mat-label>ID del examen</mat-label>
      <input matInput type="number" formControlName="idExamen" readonly>
    </mat-form-field>
  }
  <mat-form-field>
    <mat-label>Tipo de examen</mat-label>
    <input matInput formControlName="tipoExamen">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Descripcion</mat-label>
    <input matInput formControlName="descripcion">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Fecha de solicitud</mat-label>
    <input matInput [matDatepicker]="pickerSolicitud" formControlName="fechaSolicitud">
    <mat-datepicker-toggle matIconSuffix [for]="pickerSolicitud"></mat-datepicker-toggle>
    <mat-datepicker #pickerSolicitud></mat-datepicker>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Fecha de resultado</mat-label>
    <input matInput [matDatepicker]="pickerResultado" formControlName="fechaResultado">
    <mat-datepicker-toggle matIconSuffix [for]="pickerResultado"></mat-datepicker-toggle>
    <mat-datepicker #pickerResultado></mat-datepicker>
  </mat-form-field>
  <button matButton type="submit">{{ isEditing ? 'Actualizar' : 'Guardar' }}</button>
  @if (isEditing) {
    <button matButton type="button" class="btn-cancelar" routerLink="/examenes/listar">Cancelar</button>
  }
</form>
<p>{{ mensaje }}</p>
