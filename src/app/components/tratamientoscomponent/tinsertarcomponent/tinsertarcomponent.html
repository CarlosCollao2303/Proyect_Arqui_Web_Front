<div class="container">
    <div>
        <h2>Insertar tratamiento</h2>
    </div>
    <div>
        <form [formGroup]="formTratamientos" (ngSubmit)="insertarTratamiento()">
            <mat-form-field class="example-full-width">
                <mat-label>Descripcion</mat-label>
                <input matInput placeholder="Descripcion" formControlName="descripcion">
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Fecha de Inicio</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="fechaInicio">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Fecha de Fin</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="fechaFin">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
            <br>
            <mat-checkbox class="example-margin" formControlName="estado">Activo</mat-checkbox>
            <br>
            <button matButton type="submit">Guardar</button>
        </form>
        <p>{{ mensaje }}</p>
    </div>
</div>
