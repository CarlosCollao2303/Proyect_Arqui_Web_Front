<div class="container">
    <div>
        <h2>{{ isEditing ? 'Actualizar tratamiento' : 'Insertar tratamiento' }}</h2>
    </div>
    <div>
        <form [formGroup]="formTratamientos" (ngSubmit)="insertarTratamiento()">
            <mat-form-field class="example-full-width">
                <mat-label>Descripcion</mat-label>
                <input matInput placeholder="Descripcion" formControlName="descripcion">
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Fecha de Inicio</mat-label>
                <input matInput [matDatepicker]="pickerInicio" formControlName="fechaInicio">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="pickerInicio"></mat-datepicker-toggle>
                <mat-datepicker #pickerInicio></mat-datepicker>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Fecha de Fin</mat-label>
                <input matInput [matDatepicker]="pickerFin" formControlName="fechaFin">
                <mat-hint>MM/DD/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="pickerFin"></mat-datepicker-toggle>
                <mat-datepicker #pickerFin></mat-datepicker>
            </mat-form-field>
            <br>
            <mat-form-field>
                <mat-label>Estado</mat-label>
                <mat-select formControlName="estado">
                    <mat-option value="Activo">Activo</mat-option>
                    <mat-option value="Pendiente">Pendiente</mat-option>
                    <mat-option value="Finalizado">Finalizado</mat-option>
                </mat-select>
            </mat-form-field>
            <br>
            <button matButton type="submit">{{ isEditing ? 'Actualizar' : 'Guardar' }}</button>
        </form>
        <p>{{ mensaje }}</p>
    </div>
</div>
