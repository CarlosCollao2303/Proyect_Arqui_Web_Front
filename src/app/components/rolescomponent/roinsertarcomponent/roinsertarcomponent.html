<h2>{{ isEditing ? 'Actualizar rol' : 'Registrar rol' }}</h2>
<form [formGroup]="formRoles" (ngSubmit)="insertarRol()">
  @if (isEditing) {
  <mat-form-field>
    <mat-label>ID del rol</mat-label>
    <input matInput type="number" formControlName="idRol" readonly>
  </mat-form-field>
  }
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre" placeholder="Ej. ENFERMERO">
  </mat-form-field>
  <button matButton type="submit" class="btn-primary">
    <svg lucideSave aria-hidden="true"></svg>
    {{ isEditing ? 'Actualizar' : 'Guardar' }}
  </button>
  @if (isEditing) {
  <button matButton type="button" class="btn-outline" routerLink="/roles/listar">
    <svg lucideCircleX aria-hidden="true"></svg>
    Cancelar
  </button>
  }
</form>
<p>{{ mensaje }}</p>
