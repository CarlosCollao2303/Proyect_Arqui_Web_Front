<h2>Listado de roles</h2>
<div class="busqueda-id">
  <input #idRol type="number" min="1" placeholder="ID del rol">
  <button matButton type="button" class="btn-secondary" (click)="buscarRol(idRol.value)">
    <svg lucideSearch aria-hidden="true"></svg>
    Buscar por ID
  </button>
  <button matButton type="button" class="btn-outline" (click)="obtenerRoles()">
    <svg lucideRefreshCw aria-hidden="true"></svg>
    Mostrar todos
  </button>
</div>
@if (mensajeBusqueda) {
<p>{{ mensajeBusqueda }}</p>
}
@if (dataSource.data.length > 0) {
<div class="roles-grid">
  @for (item of dataSource.connect() | async; track item.idRol) {
  <mat-card class="rol-card" [class.registro-actualizado]="item.idRol === idActualizado">
    <mat-card-header>
      <mat-card-title>{{ item.nombre }}</mat-card-title>
      <mat-card-subtitle>Rol #{{ item.idRol }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-actions align="end">
      <button matIconButton class="btn-icon btn-icon-ghost" aria-label="Actualizar rol"
        [routerLink]="['/roles/actualizar', item.idRol]">
        <svg lucidePencil size="18" aria-hidden="true"></svg>
      </button>
      <button matIconButton class="btn-icon btn-icon-danger" aria-label="Eliminar rol"
        (click)="eliminarRol(item.idRol)">
        <svg lucideTrash size="18" aria-hidden="true"></svg>
      </button>
    </mat-card-actions>
  </mat-card>
  }
</div>
<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons
  aria-label="Paginación de roles"></mat-paginator>
} @else {
<p>No hay roles disponibles</p>
}
