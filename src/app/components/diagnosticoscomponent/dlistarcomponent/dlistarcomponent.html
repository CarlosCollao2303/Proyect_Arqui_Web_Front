<h2>Listado de diagnósticos</h2>
@if (dataSource.length > 0) {
  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="idDiagnostico">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let item">{{ item.idDiagnostico }}</td>
    </ng-container>
    <ng-container matColumnDef="codigoCie10">
      <th mat-header-cell *matHeaderCellDef>Código CIE-10</th>
      <td mat-cell *matCellDef="let item">{{ item.codigoCie10 }}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let item">{{ item.descripcion }}</td>
    </ng-container>
    <ng-container matColumnDef="fechaRegistro">
      <th mat-header-cell *matHeaderCellDef>Fecha de registro</th>
      <td mat-cell *matCellDef="let item">{{ item.fechaRegistro | date:'shortDate' }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let item">
        <button matIconButton class="btn-eliminar" aria-label="Eliminar diagnóstico"
          (click)="eliminarDiagnostico(item.idDiagnostico)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
} @else {
  <p>No hay diagnósticos disponibles</p>
}
