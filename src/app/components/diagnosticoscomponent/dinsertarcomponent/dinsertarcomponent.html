<h2>{{ isEditing ? 'Actualizar diagnóstico' : 'Registrar diagnóstico' }}</h2>
<form [formGroup]="formDiagnosticos" (ngSubmit)="insertarDiagnostico()">
  @if (isEditing) {
    <mat-form-field>
      <mat-label>ID del diagnóstico</mat-label>
      <input matInput type="number" formControlName="idDiagnostico" readonly>
    </mat-form-field>
  }
  <mat-form-field>
    <mat-label>Código CIE-10</mat-label>
    <input matInput formControlName="codigoCie10">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Descripción</mat-label>
    <input matInput formControlName="descripcion">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Fecha de registro</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="fechaRegistro">
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
  <button matButton type="submit">{{ isEditing ? 'Actualizar' : 'Guardar' }}</button>
  @if (isEditing) {
    <button matButton type="button" class="btn-cancelar" routerLink="/diagnosticos/listar">Cancelar</button>
  }
</form>
<p>{{ mensaje }}</p>
