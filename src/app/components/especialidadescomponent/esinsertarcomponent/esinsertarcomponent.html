<h2>{{ isEditing ? 'Actualizar especialidad' : 'Registrar especialidad' }}</h2>
<form [formGroup]="formEspecialidades" (ngSubmit)="insertarEspecialidad()">
  @if (isEditing) {
  <mat-form-field>
    <mat-label>ID de la especialidad</mat-label>
    <input matInput type="number" formControlName="idEspecialidad" readonly>
  </mat-form-field>
  }
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre" placeholder="Ej. Cardiología">
  </mat-form-field>
  <button matButton type="submit" class="btn-primary">
    <svg lucideSave aria-hidden="true"></svg>
    {{ isEditing ? 'Actualizar' : 'Guardar' }}
  </button>
  @if (isEditing) {
  <button matButton type="button" class="btn-outline" routerLink="/especialidades/listar">
    <svg lucideCircleX aria-hidden="true"></svg>
    Cancelar
  </button>
  }
</form>
<p>{{ mensaje }}</p>
